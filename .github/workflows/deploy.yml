name: Deploy

# Publica só depois que o CI passar no main. O deploy manual (workflow_dispatch)
# publica o commit atual do branch padrão. Só roda quando a variável do repo
# AZURE_DEPLOY_ENABLED=true (ligada depois de configurar o OIDC e os segredos).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # troca o token do GitHub pela credencial federada do Azure

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no App Service
    if: >-
      vars.AZURE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Empacotar o repositório versionado
        run: git archive --format=zip -o "$RUNNER_TEMP/conciliador.zip" HEAD

      - name: Enviar por zipdeploy
        run: |
          az webapp deploy \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path "$RUNNER_TEMP/conciliador.zip" \
            --type zip \
            --clean true

      - name: Esperar o app ficar saudável
        run: |
          url="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
          for _ in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)"
            if [ "$code" = "200" ]; then
              echo "app saudável em $url"
              exit 0
            fi
            sleep 10
          done
          echo "health check não respondeu 200 em 5 minutos: $url" >&2
          exit 1
