[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "conciliador-core"
version = "0.1.0"
description = "Conciliação financeira brasileira (OFX, NF-e, NFS-e nacional e CSV) como biblioteca de código aberto"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["defusedxml"]

[tool.hatch.build.targets.wheel]
packages = ["src/conciliador_core"]
