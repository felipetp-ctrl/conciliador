[project]
name = "conciliacao-ia-workspace"
version = "0.0.0"
description = "Workspace de desenvolvimento do conciliador-core"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "tools/*", "app"]

[tool.uv.sources]
conciliador-core = { workspace = true }
conciliador-synth = { workspace = true }

[dependency-groups]
dev = [
    "conciliador-core",
    "conciliador-synth",
    "django>=5.1,<6.0",
    "pyotp>=2.9,<3",
    "pytest",
    "pytest-cov",
    "hypothesis",
    "mypy",
    "ruff",
    "bandit",
    "pip-audit",
    "types-defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["packages/conciliador-core/tests", "tools/synthetic-data/tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
mypy_path = ["packages/conciliador-core/src", "tools/synthetic-data/src"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
# SECRET_KEY de dev; migrações e UI do design system (strings pt-BR longas);
# script de build de ícones (baixa de unpkg + cache em /tmp); checagem oficial
# de CNPJ (consulta https://brasilapi.com.br via urllib).
"app/conciliador/settings.py" = ["S105"]
"app/ledger/migrations/*" = ["E501"]
"app/conciliador_ui/**" = ["E501"]
"tools/build_icons.py" = ["S108", "S310"]
"app/accounts/cnpj.py" = ["S310"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B108", "B310"]
